name: Generate rust cache for PR builds
on:
  push

env:
    CARGO_TERM_COLOR: always
    TEST_CASES: single_add_1 single_loadbu

jobs:
  binaries:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      date: ${{ steps.get-date.outputs.date }}

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive

    - name: get date for cache key
      id: get-date
      run: echo "date=$(date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: setup custom binary cache
      uses: actions/cache@v3
      with:
          path: z3/
          # per-OS: binaries aren't portable across platforms
          key: z3-sdk-${{ runner.os }}-${{ hashFiles('verifier/.github/workflows/verify.yaml', 'verifier/download_z3.py', 'verifier/z3-env.sh') }}
          restore-keys: z3-sdk-${{ runner.os }}-

    - name: install custom binaries
      shell: bash
      env:
        # raises the api.github.com rate limit from 60/hour to 1000/hour
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # verifier/z3-env.sh is the single place the pinned version is named;
        # everything else derives it from there.
        z3_version="$(sed -n 's/^Z3_VERSION="\${Z3_VERSION:-\(.*\)}"$/\1/p' verifier/z3-env.sh)"
        [ -n "$z3_version" ] || { echo "could not read Z3_VERSION" >&2; exit 1; }
        # macOS's system python is PEP 668 externally-managed; venv avoids it
        python3 -m venv /tmp/download-z3-venv
        /tmp/download-z3-venv/bin/pip install --quiet requests
        # One SDK serves both the Rust link (bin/libz3.*) and the Python side's
        # subprocess solver (bin/z3, symlinked as z3/bin/z3-$z3_version).
        # download_z3.py also rewrites the macOS dylib's install-name to
        # @rpath/libz3.dylib, without which the rpath the Rust build embeds
        # cannot resolve it.
        /tmp/download-z3-venv/bin/python3 verifier/download_z3.py \
          "z3-$z3_version" --sdk "z3/z3-$z3_version" --bindir z3/bin
        # The default --solver is z3-nightly; alias it to the pinned release so
        # CI solves with the exact z3 it downloaded rather than a stale cached
        # nightly. cp (not ln) so it survives independently of the symlink.
        cp "z3/bin/z3-$z3_version" z3/bin/z3-nightly
        chmod +x z3/bin/*

  lint:
    runs-on: ubuntu-latest
    needs: [binaries, build-rust]

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive

    - name: install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: setup custom binary cache
      uses: actions/cache/restore@v5
      with:
        path: z3/
        fail-on-cache-miss: true
        key: z3-sdk-${{ runner.os }}-${{ hashFiles('verifier/.github/workflows/verify.yaml', 'verifier/download_z3.py', 'verifier/z3-env.sh') }}

    - name: install python dependencies
      run: (cd verifier && uv sync)

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.95.0

    - name: setup verifier rust cache
      uses: actions/cache@v3
      with:
          # ~/.cargo/registry must be cached alongside target/, otherwise every
          # run re-extracts crate sources with fresh mtimes, which cargo sees as
          # newer than the cached target/ fingerprints and rebuilds everything
          path: |
            verifier/rust/target/
            ~/.cargo/registry
            ~/.cargo/git
          # flint3-sys builds FLINT from source on a cache miss (~5 min)
          # workflow file is part of the key so changes to what/how we cache
          # (e.g. adding ~/.cargo/registry) invalidate old incompatible caches
          # instead of getting stuck restoring them forever (actions/cache
          # never overwrites an existing key on a hit)
          key: verifier-rust-${{ runner.os }}-${{ hashFiles('verifier/rust/Cargo.lock', 'verifier/.github/workflows/verify.yaml') }}
          restore-keys: |
            verifier-rust-${{ runner.os }}-

    - name: use the downloaded z3 for linking (no system-wide z3)
      shell: bash
      run: |
        # z3-env.sh sets Z3_LIBRARY_PATH_OVERRIDE / Z3_NO_PKG_CONFIG /
        # Z3_SYS_Z3_VERSION for z3-sys's build script, plus an rpath in
        # RUSTFLAGS. Deliberately no LD_LIBRARY_PATH: the rpath covers the Rust
        # binaries, and LD_LIBRARY_PATH would also hijack the z3-solver
        # package's own libz3 inside python3.
        source verifier/z3-env.sh
        for var in Z3_ROOT Z3_PREFIX Z3_LIB_DIR Z3_BIN_DIR \
                   Z3_LIBRARY_PATH_OVERRIDE Z3_NO_PKG_CONFIG \
                   Z3_SYS_Z3_VERSION Z3_SYS_Z3_HEADER RUSTFLAGS; do
          echo "$var=${!var}" >> "$GITHUB_ENV"
        done

    - name: build verifier rust workspace
      run: cargo build --release --workspace --manifest-path verifier/rust/Cargo.toml

    - name: run formatter
      continue-on-error: true
      run: uv run ruff format --diff .
      working-directory: verifier

    - name: run linter
      continue-on-error: true
      run: uv run ruff check .
      working-directory: verifier

    - name: run tests
      continue-on-error: true
      run: uv run pytest
      working-directory: verifier

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            test_cases: "single_add_1 single_loadbu"
          - os: macos-latest
            test_cases: "single_add_1"
    runs-on: ${{ matrix.os }}
    needs: [binaries, build-rust]

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive

    - name: checkout powdr
      uses: actions/checkout@v6
      with:
        repository: powdr-labs/powdr
        ref: main
        path: powdr
        submodules: recursive

    - name: install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.95.0

    - name: setup cargo cache
      uses: actions/cache@v3
      with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            powdr/target/
          key: cargo-${{ hashFiles('powdr/Cargo.toml') }}-${{ needs.binaries.outputs.date }}
          restore-keys: |
            cargo-

    - name: setup verifier rust cache
      uses: actions/cache@v3
      with:
          # ~/.cargo/registry must be cached alongside target/, otherwise every
          # run re-extracts crate sources with fresh mtimes, which cargo sees as
          # newer than the cached target/ fingerprints and rebuilds everything
          path: |
            verifier/rust/target/
            ~/.cargo/registry
            ~/.cargo/git
          # flint3-sys builds FLINT from source on a cache miss (~5 min)
          # workflow file is part of the key so changes to what/how we cache
          # (e.g. adding ~/.cargo/registry) invalidate old incompatible caches
          # instead of getting stuck restoring them forever (actions/cache
          # never overwrites an existing key on a hit)
          key: verifier-rust-${{ runner.os }}-${{ hashFiles('verifier/rust/Cargo.lock', 'verifier/.github/workflows/verify.yaml') }}
          restore-keys: |
            verifier-rust-${{ runner.os }}-

    - name: setup custom binary cache
      uses: actions/cache/restore@v5
      with:
        path: z3/
        fail-on-cache-miss: true
        key: z3-sdk-${{ runner.os }}-${{ hashFiles('verifier/.github/workflows/verify.yaml', 'verifier/download_z3.py', 'verifier/z3-env.sh') }}

    - name: install autotools
      # needed for flint3-sys's from-source FLINT build; Ubuntu ships these already
      if: runner.os == 'macOS'
      run: brew install autoconf automake libtool

    - name: install python dependencies
      run: (cd verifier && uv sync)

    - name: use the downloaded z3 for linking (no system-wide z3)
      shell: bash
      run: |
        # z3-env.sh sets Z3_LIBRARY_PATH_OVERRIDE / Z3_NO_PKG_CONFIG /
        # Z3_SYS_Z3_VERSION for z3-sys's build script, plus an rpath in
        # RUSTFLAGS. Deliberately no LD_LIBRARY_PATH: the rpath covers the Rust
        # binaries, and LD_LIBRARY_PATH would also hijack the z3-solver
        # package's own libz3 inside python3.
        source verifier/z3-env.sh
        for var in Z3_ROOT Z3_PREFIX Z3_LIB_DIR Z3_BIN_DIR \
                   Z3_LIBRARY_PATH_OVERRIDE Z3_NO_PKG_CONFIG \
                   Z3_SYS_Z3_VERSION Z3_SYS_Z3_HEADER RUSTFLAGS; do
          echo "$var=${!var}" >> "$GITHUB_ENV"
        done

    - name: build verifier rust workspace
      # The tracer/evaluator/verifier resolve the rust simplifier at
      # rust/target/release/simplifier; without this build they fall back to the
      # slow python passes. The rpath in RUSTFLAGS (above) is what lets the
      # built binary find the SDK's libz3 at run time.
      run: cargo build --release --workspace --manifest-path verifier/rust/Cargo.toml

    - name: run test cases
      run: |
        for test in ${{ matrix.test_cases }}; do
          echo "::group::run powdr on ${test}"
          uv run --project verifier python3 verifier/orchestrate.py powdr ${test} || exit 1
          echo "::endgroup::"
        done

    - name: run tracer
      run: |
        for test in ${{ matrix.test_cases }}; do
          echo "::group::run tracer on ${test}"
          uv run --project verifier python3 verifier/orchestrate.py trace ${test} : || exit 1
          echo "::endgroup::"
        done

    - name: run evaluator
      run: |
        for test in ${{ matrix.test_cases }}; do
          echo "::group::run evaluator on ${test}"
          uv run --project verifier python3 verifier/orchestrate.py eval ${test} : || exit 1
          echo "::endgroup::"
        done

    - name: run separate evaluator
      run: |
        for test in ${{ matrix.test_cases }}; do
          echo "::group::run separate evaluator on ${test}"
          uv run --project verifier python3 verifier/orchestrate.py evaluate ${test} : || exit 1
          echo "::endgroup::"
        done

    - name: run verifier
      run: |
        for test in ${{ matrix.test_cases }}; do
          echo "::group::run verifier on ${test}"
          uv run --project verifier python3 verifier/orchestrate.py verify ${test} : || exit 1
          echo "::endgroup::"
        done

    - name: generate reports
      run: |
        for test in ${{ matrix.test_cases }}; do
          echo "::group::run verifier on ${test}"
          uv run --project verifier python3 verifier/main.py report verifier/reports/${test} report_${test}.html || exit 1
          echo "::endgroup::"
        done

    - name: upload reports (single_add_1)
      uses: actions/upload-artifact@v7
      with:
        name: report_single_add_1-${{ matrix.os }}
        path: report_single_add_1.html
        archive: false
    - name: upload reports (single_loadbu)
      if: contains(matrix.test_cases, 'single_loadbu')
      uses: actions/upload-artifact@v7
      with:
        name: report_single_loadbu-${{ matrix.os }}
        path: report_single_loadbu.html
        archive: false

  build-rust:
    needs: binaries
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive

    # reuse binaries' cache instead of redownloading z3
    - name: restore binary cache
      uses: actions/cache/restore@v5
      with:
        path: z3/
        fail-on-cache-miss: true
        key: z3-sdk-${{ runner.os }}-${{ hashFiles('verifier/.github/workflows/verify.yaml', 'verifier/download_z3.py', 'verifier/z3-env.sh') }}

    - name: install autotools
      # needed for flint3-sys's from-source FLINT build; Ubuntu ships these already
      if: runner.os == 'macOS'
      run: brew install autoconf automake libtool

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.95.0

    - name: setup verifier rust cache
      uses: actions/cache@v3
      with:
          # ~/.cargo/registry must be cached alongside target/, otherwise every
          # run re-extracts crate sources with fresh mtimes, which cargo sees as
          # newer than the cached target/ fingerprints and rebuilds everything
          path: |
            verifier/rust/target/
            ~/.cargo/registry
            ~/.cargo/git
          # flint3-sys builds FLINT from source on a cache miss (~5 min)
          # workflow file is part of the key so changes to what/how we cache
          # (e.g. adding ~/.cargo/registry) invalidate old incompatible caches
          # instead of getting stuck restoring them forever (actions/cache
          # never overwrites an existing key on a hit)
          key: verifier-rust-${{ runner.os }}-${{ hashFiles('verifier/rust/Cargo.lock', 'verifier/.github/workflows/verify.yaml') }}
          restore-keys: |
            verifier-rust-${{ runner.os }}-

    - name: use the downloaded z3 for linking (no system-wide z3)
      shell: bash
      run: |
        # z3-env.sh sets Z3_LIBRARY_PATH_OVERRIDE / Z3_NO_PKG_CONFIG /
        # Z3_SYS_Z3_VERSION for z3-sys's build script, plus an rpath in
        # RUSTFLAGS. Deliberately no LD_LIBRARY_PATH: the rpath covers the Rust
        # binaries, and LD_LIBRARY_PATH would also hijack the z3-solver
        # package's own libz3 inside python3.
        source verifier/z3-env.sh
        for var in Z3_ROOT Z3_PREFIX Z3_LIB_DIR Z3_BIN_DIR \
                   Z3_LIBRARY_PATH_OVERRIDE Z3_NO_PKG_CONFIG \
                   Z3_SYS_Z3_VERSION Z3_SYS_Z3_HEADER RUSTFLAGS; do
          echo "$var=${!var}" >> "$GITHUB_ENV"
        done

    - name: diagnose the z3 the build will use
      shell: bash
      run: |
        echo "Z3_PREFIX=$Z3_PREFIX"
        echo "Z3_SYS_Z3_VERSION=$Z3_SYS_Z3_VERSION"
        echo "RUSTFLAGS=$RUSTFLAGS"
        echo "--- sdk contents ---"
        ls -la "$Z3_LIB_DIR" "$Z3_PREFIX/include" 2>&1 || true
        echo "--- installed binaries ---"
        ls -la "$Z3_BIN_DIR" 2>&1 || true
        "$Z3_BIN_DIR/z3-$Z3_SYS_Z3_VERSION" --version || true

    - name: build verifier rust workspace
      run: cargo build --release --workspace --manifest-path verifier/rust/Cargo.toml

    - name: diagnose which z3 actually got linked
      shell: bash
      run: |
        bin=verifier/rust/target/release/simplifier
        if [ "${{ runner.os }}" = "macOS" ]; then
          otool -L "$bin" | grep -i z3 || echo "no z3 dylib reference found via otool"
        else
          ldd "$bin" | grep -i z3 || echo "no z3 shared-object reference found via ldd"
        fi

    - name: run rust tests
      run: cargo test --release --workspace --manifest-path verifier/rust/Cargo.toml
