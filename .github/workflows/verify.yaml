name: Generate rust cache for PR builds
on:
  push

env:
    CARGO_TERM_COLOR: always
    TEST_CASES: single_add_1 single_loadbu

jobs:
  binaries:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      date: ${{ steps.get-date.outputs.date }}

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive

    - name: get date for cache key
      id: get-date
      run: echo "date=$(date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: setup custom binary cache
      uses: actions/cache@v3
      with:
          path: ~/bin/
          # per-OS: binaries aren't portable across platforms
          key: bin-sdk-${{ runner.os }}-${{ hashFiles('.github/workflows/verify.yaml', 'verifier/download_z3.py') }}
          restore-keys: bin-sdk-${{ runner.os }}-

    - name: install custom binaries
      shell: bash
      env:
        # raises the api.github.com rate limit from 60/hour to 1000/hour
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p ~/bin/
        # macOS's system python is PEP 668 externally-managed; venv avoids it
        python3 -m venv ~/bin/.download-z3-venv
        ~/bin/.download-z3-venv/bin/pip install --quiet requests
        ~/bin/.download-z3-venv/bin/python3 verifier/download_z3.py z3-4.16.0 --bindir ~/bin/ --sdk ~/bin/z3-sdk
        # the downloaded dylib's own install-name is a bare "libz3.dylib", which
        # dyld won't resolve via LC_RPATH (only "@rpath/..."-prefixed refs are);
        # rewrite it before anything links against it
        if [ "${{ runner.os }}" = "macOS" ]; then
          install_name_tool -id "@rpath/libz3.dylib" ~/bin/z3-sdk/bin/libz3.dylib
        fi
        # The default --solver is z3-nightly (~/bin/z3-nightly); alias it to the
        # pinned release so CI solves with the exact z3 it downloaded instead of
        # a stale cached nightly.
        cp ~/bin/z3-4.16.0 ~/bin/z3-nightly
        chmod +x ~/bin/*
        # pkg-config file so z3-sys links the downloaded z3 (the parser-context
        # API in smt2/z3_parse.rs needs a recent z3, newer than distro packages).
        mkdir -p ~/bin/z3-sdk/pkgconfig
        printf '%s\n' \
          'Name: z3' \
          'Description: Z3 theorem prover' \
          'Version: 4.16.0' \
          "Libs: -L$HOME/bin/z3-sdk/bin -lz3" \
          "Cflags: -I$HOME/bin/z3-sdk/include" \
          > ~/bin/z3-sdk/pkgconfig/z3.pc

  lint:
    runs-on: ubuntu-latest
    needs: [binaries, build-rust]

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: setup custom binary cache
      uses: actions/cache/restore@v5
      with:
        path: ~/bin/
        fail-on-cache-miss: true
        key: bin-sdk-${{ runner.os }}-${{ hashFiles('.github/workflows/verify.yaml', 'verifier/download_z3.py') }}

    - name: install python dependencies
      run: |
        pip install -r verifier/requirements.txt
        pysmt-install --z3 --confirm-agreement

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.95.0

    - name: setup verifier rust cache
      uses: actions/cache@v3
      with:
          # ~/.cargo/registry must be cached alongside target/, otherwise every
          # run re-extracts crate sources with fresh mtimes, which cargo sees as
          # newer than the cached target/ fingerprints and rebuilds everything
          path: |
            verifier/rust/target/
            ~/.cargo/registry
            ~/.cargo/git
          # flint3-sys builds FLINT from source on a cache miss (~5 min)
          key: verifier-rust-${{ runner.os }}-${{ hashFiles('verifier/rust/Cargo.lock') }}
          restore-keys: |
            verifier-rust-${{ runner.os }}-

    - name: use the downloaded z3 for linking (no system-wide z3)
      run: |
        echo "PKG_CONFIG_PATH=$HOME/bin/z3-sdk/pkgconfig" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$HOME/bin/z3-sdk/bin" >> "$GITHUB_ENV"

    - name: build verifier rust workspace
      run: cargo build --release --workspace --manifest-path verifier/rust/Cargo.toml

    - name: run formatter
      continue-on-error: true
      run: ruff format --diff verifier/

    - name: run linter
      continue-on-error: true
      run: ruff check verifier/

    - name: run tests
      continue-on-error: true
      run: pytest

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            test_cases: "single_add_1 single_loadbu"
          - os: macos-latest
            test_cases: "single_add_1"
    runs-on: ${{ matrix.os }}
    needs: [binaries, build-rust]

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive

    - name: checkout powdr
      uses: actions/checkout@v6
      with:
        repository: powdr-labs/powdr
        ref: main
        path: powdr
        submodules: recursive

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.95.0

    - name: setup cargo cache
      uses: actions/cache@v3
      with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            powdr/target/
          key: cargo-${{ hashFiles('powdr/Cargo.toml') }}-${{ needs.binaries.outputs.date }}
          restore-keys: |
            cargo-

    - name: setup verifier rust cache
      uses: actions/cache@v3
      with:
          # ~/.cargo/registry must be cached alongside target/, otherwise every
          # run re-extracts crate sources with fresh mtimes, which cargo sees as
          # newer than the cached target/ fingerprints and rebuilds everything
          path: |
            verifier/rust/target/
            ~/.cargo/registry
            ~/.cargo/git
          # flint3-sys builds FLINT from source on a cache miss (~5 min)
          key: verifier-rust-${{ runner.os }}-${{ hashFiles('verifier/rust/Cargo.lock') }}
          restore-keys: |
            verifier-rust-${{ runner.os }}-

    - name: setup custom binary cache
      uses: actions/cache/restore@v5
      with:
        path: ~/bin/
        fail-on-cache-miss: true
        key: bin-sdk-${{ runner.os }}-${{ hashFiles('.github/workflows/verify.yaml', 'verifier/download_z3.py') }}

    - name: install autotools
      # needed for flint3-sys's from-source FLINT build; Ubuntu ships these already
      if: runner.os == 'macOS'
      run: brew install autoconf automake libtool

    - name: install python dependencies
      run: |
        pip install -r verifier/requirements.txt
        pysmt-install --z3 --confirm-agreement

    - name: use the downloaded z3 for linking (no system-wide z3)
      shell: bash
      run: |
        echo "PKG_CONFIG_PATH=$HOME/bin/z3-sdk/pkgconfig" >> "$GITHUB_ENV"
        # embeds an rpath (build.rs) so *_LIBRARY_PATH doesn't also hijack pysmt's z3 import
        echo "Z3_LIB_DIR=$HOME/bin/z3-sdk/bin" >> "$GITHUB_ENV"
        if [ "${{ runner.os }}" != "macOS" ]; then
          echo "LD_LIBRARY_PATH=$HOME/bin/z3-sdk/bin" >> "$GITHUB_ENV"
        fi

    - name: build verifier rust workspace
      # The tracer/evaluator/verifier resolve the rust simplifier at
      # rust/target/release/simplifier; without this build they fall back to the
      # slow python passes. LD_LIBRARY_PATH (above) is also needed at run time so
      # the binary finds the SDK's libz3.so.
      run: cargo build --release --workspace --manifest-path verifier/rust/Cargo.toml

    - name: cargo clean
      run: cd powdr && cargo clean

    - name: run test cases
      run: |
        for test in ${{ matrix.test_cases }}; do
          echo "::group::run powdr on ${test}"
          python3 verifier/orchestrate.py powdr ${test} || exit 1
          echo "::endgroup::"
        done

    - name: run tracer
      run: |
        for test in ${{ matrix.test_cases }}; do
          echo "::group::run tracer on ${test}"
          python3 verifier/orchestrate.py trace ${test} : || exit 1
          echo "::endgroup::"
        done

    - name: run evaluator
      run: |
        for test in ${{ matrix.test_cases }}; do
          echo "::group::run evaluator on ${test}"
          python3 verifier/orchestrate.py eval ${test} : || exit 1
          echo "::endgroup::"
        done

    - name: run separate evaluator
      run: |
        for test in ${{ matrix.test_cases }}; do
          echo "::group::run separate evaluator on ${test}"
          python3 verifier/orchestrate.py evaluate ${test} : || exit 1
          echo "::endgroup::"
        done

    - name: run verifier
      run: |
        for test in ${{ matrix.test_cases }}; do
          echo "::group::run verifier on ${test}"
          python3 verifier/orchestrate.py verify ${test} : || exit 1
          echo "::endgroup::"
        done

    - name: generate reports
      run: |
        for test in ${{ matrix.test_cases }}; do
          echo "::group::run verifier on ${test}"
          python3 verifier/main.py report verifier/reports/${test} report_${test}.html || exit 1
          echo "::endgroup::"
        done

    - name: upload reports (single_add_1)
      uses: actions/upload-artifact@v7
      with:
        name: report_single_add_1-${{ matrix.os }}
        path: report_single_add_1.html
        archive: false
    - name: upload reports (single_loadbu)
      if: contains(matrix.test_cases, 'single_loadbu')
      uses: actions/upload-artifact@v7
      with:
        name: report_single_loadbu-${{ matrix.os }}
        path: report_single_loadbu.html
        archive: false

  build-rust:
    needs: binaries
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive

    # reuse binaries' cache instead of redownloading z3
    - name: restore binary cache
      uses: actions/cache/restore@v5
      with:
        path: ~/bin/
        fail-on-cache-miss: true
        key: bin-sdk-${{ runner.os }}-${{ hashFiles('.github/workflows/verify.yaml', 'verifier/download_z3.py') }}

    - name: install autotools
      # needed for flint3-sys's from-source FLINT build; Ubuntu ships these already
      if: runner.os == 'macOS'
      run: brew install autoconf automake libtool

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.95.0

    - name: setup verifier rust cache
      uses: actions/cache@v3
      with:
          # ~/.cargo/registry must be cached alongside target/, otherwise every
          # run re-extracts crate sources with fresh mtimes, which cargo sees as
          # newer than the cached target/ fingerprints and rebuilds everything
          path: |
            verifier/rust/target/
            ~/.cargo/registry
            ~/.cargo/git
          # flint3-sys builds FLINT from source on a cache miss (~5 min)
          key: verifier-rust-${{ runner.os }}-${{ hashFiles('verifier/rust/Cargo.lock') }}
          restore-keys: |
            verifier-rust-${{ runner.os }}-

    - name: use the downloaded z3 for linking (no system-wide z3)
      shell: bash
      run: |
        echo "PKG_CONFIG_PATH=$HOME/bin/z3-sdk/pkgconfig" >> "$GITHUB_ENV"
        # embeds an rpath (build.rs) so *_LIBRARY_PATH doesn't also hijack pysmt's z3 import
        echo "Z3_LIB_DIR=$HOME/bin/z3-sdk/bin" >> "$GITHUB_ENV"
        if [ "${{ runner.os }}" != "macOS" ]; then
          echo "LD_LIBRARY_PATH=$HOME/bin/z3-sdk/bin" >> "$GITHUB_ENV"
        fi

    - name: diagnose which z3 pkg-config resolves
      shell: bash
      run: |
        echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
        cat ~/bin/z3-sdk/pkgconfig/z3.pc || true
        echo "--- pkg-config --modversion z3 ---"
        pkg-config --modversion z3 || echo "pkg-config could not resolve z3"
        echo "--- pkg-config --libs --cflags z3 ---"
        pkg-config --libs --cflags z3 || true
        echo "--- our downloaded sdk contents ---"
        ls -la ~/bin/z3-sdk/bin ~/bin/z3-sdk/include 2>&1 || true

    - name: build verifier rust workspace
      run: cargo build --release --workspace --manifest-path verifier/rust/Cargo.toml

    - name: diagnose which z3 actually got linked
      shell: bash
      run: |
        bin=verifier/rust/target/release/simplifier
        if [ "${{ runner.os }}" = "macOS" ]; then
          otool -L "$bin" | grep -i z3 || echo "no z3 dylib reference found via otool"
        else
          ldd "$bin" | grep -i z3 || echo "no z3 shared-object reference found via ldd"
        fi

    - name: run rust tests
      run: cargo test --release --workspace --manifest-path verifier/rust/Cargo.toml
