name: Generate rust cache for PR builds
on:
  push

env:
    CARGO_TERM_COLOR: always
    TEST_CASES: single_add_1 single_loadbu

jobs:
  binaries:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      date: ${{ steps.get-date.outputs.date }}

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive

    - name: get date for cache key
      id: get-date
      run: echo "date=$(date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: setup custom binary cache
      uses: actions/cache@v3
      with:
          path: ~/bin/
          # Keyed per-OS: these binaries (z3, libz3) aren't portable across
          # platforms, and a shared prefix would let restore-keys pull in
          # the wrong one.
          key: bin-sdk-${{ runner.os }}-${{ steps.get-date.outputs.date }}
          restore-keys: bin-sdk-${{ runner.os }}-

    - name: install custom binaries
      shell: bash
      run: |
        mkdir -p ~/bin/
        # download_z3.py needs `requests`. The system python is externally
        # managed (PEP 668) on the macOS runner (not on Ubuntu's), so install
        # it into a throwaway venv rather than touching the system/global
        # site-packages -- this works uniformly on both.
        python3 -m venv ~/bin/.download-z3-venv
        ~/bin/.download-z3-venv/bin/pip install --quiet requests
        # Download the z3 release SDK (z3 binary + libz3 + headers) so the
        # rust workspace links against this exact z3 instead of a
        # system-wide one; download_z3.py auto-selects the OS/arch asset.
        ~/bin/.download-z3-venv/bin/python3 verifier/download_z3.py z3-4.16.0 --bindir ~/bin/ --sdk ~/bin/z3-sdk
        # The default --solver is z3-nightly (~/bin/z3-nightly); alias it to the
        # pinned release so CI solves with the exact z3 it downloaded instead of
        # a stale cached nightly.
        cp ~/bin/z3-4.16.0 ~/bin/z3-nightly
        chmod +x ~/bin/*
        # pkg-config file so z3-sys links the downloaded z3 (the parser-context
        # API in smt2/z3_parse.rs needs a recent z3, newer than distro packages).
        mkdir -p ~/bin/z3-sdk/pkgconfig
        printf '%s\n' \
          'Name: z3' \
          'Description: Z3 theorem prover' \
          'Version: 4.16.0' \
          "Libs: -L$HOME/bin/z3-sdk/bin -lz3" \
          "Cflags: -I$HOME/bin/z3-sdk/include" \
          > ~/bin/z3-sdk/pkgconfig/z3.pc

  lint:
    runs-on: ubuntu-latest
    needs: [binaries, build-rust]

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: setup custom binary cache
      uses: actions/cache/restore@v5
      with:
        path: ~/bin/
        fail-on-cache-miss: true
        key: bin-sdk-${{ runner.os }}-${{ needs.binaries.outputs.date }}
      
    - name: install python dependencies
      run: |
        pip install -r verifier/requirements.txt
        pysmt-install --z3 --confirm-agreement

    - uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: setup verifier rust cache
      uses: actions/cache@v3
      with:
          path: verifier/rust/target/
          # flint3-sys builds FLINT (+ GMP/MPFR) from source on a cache miss,
          # which takes several minutes; cache it keyed on the lockfile. Keyed
          # per-OS too: target/ artifacts aren't portable across platforms, and
          # a shared prefix would let restore-keys pull in the wrong one.
          key: verifier-rust-${{ runner.os }}-${{ hashFiles('verifier/rust/Cargo.lock') }}
          restore-keys: |
            verifier-rust-${{ runner.os }}-

    - name: use the downloaded z3 for linking (no system-wide z3)
      run: |
        echo "PKG_CONFIG_PATH=$HOME/bin/z3-sdk/pkgconfig" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$HOME/bin/z3-sdk/bin" >> "$GITHUB_ENV"

    - name: build verifier rust workspace
      run: cargo build --release --workspace --manifest-path verifier/rust/Cargo.toml

    - name: run formatter
      continue-on-error: true
      run: ruff format --diff verifier/

    - name: run linter
      continue-on-error: true
      run: ruff check verifier/

    - name: run tests
      continue-on-error: true
      run: pytest

  build:
    runs-on: ubuntu-latest
    needs: [binaries, build-rust]

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive

    - name: checkout powdr
      uses: actions/checkout@v6
      with:
        repository: powdr-labs/powdr
        ref: main
        path: powdr
        submodules: recursive

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.95.0

    - name: setup cargo cache
      uses: actions/cache@v3
      with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            powdr/target/
          key: cargo-${{ hashFiles('powdr/Cargo.toml') }}-${{ needs.binaries.outputs.date }}
          restore-keys: |
            cargo-

    - name: setup verifier rust cache
      uses: actions/cache@v3
      with:
          path: verifier/rust/target/
          # flint3-sys builds FLINT (+ GMP/MPFR) from source on a cache miss,
          # which takes several minutes; cache it keyed on the lockfile. Keyed
          # per-OS too: target/ artifacts aren't portable across platforms, and
          # a shared prefix would let restore-keys pull in the wrong one.
          key: verifier-rust-${{ runner.os }}-${{ hashFiles('verifier/rust/Cargo.lock') }}
          restore-keys: |
            verifier-rust-${{ runner.os }}-

    - name: setup custom binary cache
      uses: actions/cache/restore@v5
      with:
        path: ~/bin/
        fail-on-cache-miss: true
        key: bin-sdk-${{ runner.os }}-${{ needs.binaries.outputs.date }}
    
    - name: install python dependencies
      run: |
        pip install -r verifier/requirements.txt
        pysmt-install --z3 --confirm-agreement

    - name: use the downloaded z3 for linking (no system-wide z3)
      run: |
        echo "PKG_CONFIG_PATH=$HOME/bin/z3-sdk/pkgconfig" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$HOME/bin/z3-sdk/bin" >> "$GITHUB_ENV"

    - name: build verifier rust workspace
      # The tracer/evaluator/verifier resolve the rust simplifier at
      # rust/target/release/simplifier; without this build they fall back to the
      # slow python passes. LD_LIBRARY_PATH (above) is also needed at run time so
      # the binary finds the SDK's libz3.so.
      run: cargo build --release --workspace --manifest-path verifier/rust/Cargo.toml

    - name: cargo clean
      run: cd powdr && cargo clean

    - name: run test cases
      run: |
        for test in ${{ env.TEST_CASES }}; do
          echo "::group::run powdr on ${test}"
          python3 verifier/orchestrate.py powdr ${test} || exit 1
          echo "::endgroup::"
        done
    
    - name: run tracer
      run: |
        for test in ${{ env.TEST_CASES }}; do
          echo "::group::run tracer on ${test}"
          python3 verifier/orchestrate.py trace ${test} : || exit 1
          echo "::endgroup::"
        done
    
    - name: run evaluator
      run: |
        for test in ${{ env.TEST_CASES }}; do
          echo "::group::run evaluator on ${test}"
          python3 verifier/orchestrate.py eval ${test} : || exit 1
          echo "::endgroup::"
        done
    
    - name: run separate evaluator
      run: |
        for test in ${{ env.TEST_CASES }}; do
          echo "::group::run separate evaluator on ${test}"
          python3 verifier/orchestrate.py evaluate ${test} : || exit 1
          echo "::endgroup::"
        done

    - name: run verifier
      run: |
        for test in ${{ env.TEST_CASES }}; do
          echo "::group::run verifier on ${test}"
          python3 verifier/orchestrate.py verify ${test} : || exit 1
          echo "::endgroup::"
        done
    
    - name: generate reports
      run: |
        for test in ${{ env.TEST_CASES }}; do
          echo "::group::run verifier on ${test}"
          python3 verifier/main.py report verifier/reports/${test} report_${test}.html || exit 1
          echo "::endgroup::"
        done
    
    - name: upload reports
      uses: actions/upload-artifact@v7
      with:
        path: report_single_add_1.html
        archive: false
    - name: upload reports
      uses: actions/upload-artifact@v7
      with:
        path: report_single_loadbu.html
        archive: false

  build-rust:
    needs: binaries
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive

    # `binaries` already built and cached this for every OS in the matrix;
    # just reuse it (same as lint/build) instead of redownloading z3 again.
    - name: restore binary cache
      uses: actions/cache/restore@v5
      with:
        path: ~/bin/
        fail-on-cache-miss: true
        key: bin-sdk-${{ runner.os }}-${{ needs.binaries.outputs.date }}

    - name: install autotools
      # flint3-sys builds FLINT (+ GMP/MPFR) from source via autotools on a
      # cache miss. Ubuntu's runner image ships these already; macOS's doesn't.
      if: runner.os == 'macOS'
      run: brew install autoconf automake libtool

    - uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: setup verifier rust cache
      uses: actions/cache@v3
      with:
          path: verifier/rust/target/
          # Keyed per-OS too: target/ artifacts aren't portable across
          # platforms, and a shared prefix would let restore-keys pull in
          # the wrong one.
          key: verifier-rust-${{ runner.os }}-${{ hashFiles('verifier/rust/Cargo.lock') }}
          restore-keys: |
            verifier-rust-${{ runner.os }}-

    - name: use the downloaded z3 for linking (no system-wide z3)
      shell: bash
      run: |
        echo "PKG_CONFIG_PATH=$HOME/bin/z3-sdk/pkgconfig" >> "$GITHUB_ENV"
        if [ "${{ runner.os }}" = "macOS" ]; then
          echo "DYLD_LIBRARY_PATH=$HOME/bin/z3-sdk/bin" >> "$GITHUB_ENV"
        else
          echo "LD_LIBRARY_PATH=$HOME/bin/z3-sdk/bin" >> "$GITHUB_ENV"
        fi

    - name: build verifier rust workspace
      run: cargo build --release --workspace --manifest-path verifier/rust/Cargo.toml

    - name: run rust tests
      run: cargo test --release --workspace --manifest-path verifier/rust/Cargo.toml
