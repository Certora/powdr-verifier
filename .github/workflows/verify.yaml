name: Generate rust cache for PR builds
on:
  push

env:
    CARGO_TERM_COLOR: always
    TEST_CASES: single_add_1 single_loadbu

jobs:
  binaries:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.get-date.outputs.date }}

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive
    
    - name: get date for cache key
      id: get-date
      run: echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
      shell: bash

    - name: setup custom binary cache
      uses: actions/cache@v3
      with:
          path: ~/bin/
          key: bin-${{ steps.get-date.outputs.date }}
          restore-keys: bin-

    - name: install custom binaries
      run: |
        mkdir -p ~/bin/
        python3 verifier/download_z3.py z3-4.15.4 ~/bin/
        chmod +x ~/bin/*

  lint:
    runs-on: ubuntu-latest
    needs: binaries

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: setup custom binary cache
      uses: actions/cache/restore@v5
      with:
        path: ~/bin/
        fail-on-cache-miss: true
        key: bin-${{ needs.binaries.outputs.date }}
      
    - name: install python dependencies
      run: |
        pip install -r verifier/requirements.txt
        pysmt-install --z3 --confirm-agreement
  
    - name: run formatter
      continue-on-error: true
      run: ruff format --diff verifier/

    - name: run linter
      continue-on-error: true
      run: ruff check verifier/

    - name: run tests
      continue-on-error: true
      run: pytest

  build:
    runs-on: ubuntu-latest
    needs: binaries

    steps:
    - name: checkout verifier
      uses: actions/checkout@v6
      with:
        path: verifier
        submodules: recursive

    - name: checkout powdr
      uses: actions/checkout@v6
      with:
        repository: Certora/powdr
        ref: develop
        path: powdr
        submodules: recursive
        ssh-key: ${{ secrets.DEPLOY_KEY_POWDR }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.82.0

    - name: setup cargo cache
      uses: actions/cache@v3
      with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            powdr/target/
          key: cargo-${{ hashFiles('powdr/Cargo.toml') }}-${{ needs.binaries.outputs.date }}
          restore-keys: |
            cargo-

    - name: setup custom binary cache
      uses: actions/cache/restore@v5
      with:
        path: ~/bin/
        fail-on-cache-miss: true
        key: bin-${{ needs.binaries.outputs.date }}
    
    - name: install python dependencies
      run: |
        pip install -r verifier/requirements.txt
        pysmt-install --z3 --confirm-agreement

    - name: cargo clean
      run: cd powdr && cargo clean

    - name: run test cases
      run: |
        for test in ${{ env.TEST_CASES }}; do
          echo "::group::run powdr on ${test}"
          python3 verifier/orchestrate.py powdr ${test} || exit 1
          echo "::endgroup::"
        done
    
    - name: run tracer
      run: |
        for test in ${{ env.TEST_CASES }}; do
          echo "::group::run tracer on ${test}"
          python3 verifier/orchestrate.py trace : ${test} || exit 1
          echo "::endgroup::"
        done
    
    - name: run evaluator
      run: |
        for test in ${{ env.TEST_CASES }}; do
          echo "::group::run evaluator on ${test}"
          python3 verifier/orchestrate.py eval : ${test} || exit 1
          echo "::endgroup::"
        done
    
    - name: run separate evaluator
      run: |
        for test in ${{ env.TEST_CASES }}; do
          echo "::group::run separate evaluator on ${test}"
          python3 verifier/orchestrate.py evaluate : ${test} || exit 1
          echo "::endgroup::"
        done

    - name: run verifier
      run: |
        for test in ${{ env.TEST_CASES }}; do
          echo "::group::run verifier on ${test}"
          python3 verifier/orchestrate.py verify : ${test} || exit 1
          echo "::endgroup::"
        done
    