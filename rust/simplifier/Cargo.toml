[package]
name = "simplifier"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "simplifier"
path = "src/main.rs"

[dependencies]
smt2 = { path = "../smt2" }
z3.workspace = true
# builds on both Linux and macOS, unlike flint-sys (see poly_factor/ffi.rs)
flint3-sys = { version = "3.6.0", features = ["gmp-mpfr-sys"] }
serde_json = "1"
