[package]
name = "simplifier"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "simplifier"
path = "src/main.rs"

[dependencies]
smt2 = { path = "../smt2" }
z3 = "0.20"
z3-sys = "0.11"
# flint3-sys builds on both Linux and macOS (flint-sys's bindgen layout tests
# hard-code the Linux struct layout and fail on Darwin); see
# src/poly_factor/ffi.rs for the FFI shim this backs.
flint3-sys = { version = "3.6.0", features = ["gmp-mpfr-sys"] }
serde_json = "1"

[build-dependencies]
