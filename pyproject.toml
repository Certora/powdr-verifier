[project]
name = "powdr-verifier"
version = "0.1.0"
description = "Formal equivalence checking for powdr's APC optimizer, via SMT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "plotly",
    "psutil",
    "pysmt",
    "requests",
    "rich",
    "semver",
    "setuptools",
    "sympy",
    "termcolor",
    # Kept in step with Z3_VERSION in z3-env.sh: this wheel carries its own
    # bundled libz3 for the in-process bindings, separate from the SDK the Rust
    # workspace links and the binary the generic solvers exec, so it is the one
    # z3 that has to be pinned by hand. pysmt detects an importable `z3` module
    # directly, so there is no separate install step.
    "z3-solver==5.1.0.0",
]

[project.optional-dependencies]
# needed only by plot_benchmark_results.py
plots = ["matplotlib"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
exclude = [
    ".github",
    ".venv",
    "test_*.py",
    "src/smt_backends/pysmt.py",
]

[tool.ruff.lint]
ignore = ["F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"orchestrate.py" = ["E701"]

[tool.pytest.ini_options]
pythonpath = ["."]