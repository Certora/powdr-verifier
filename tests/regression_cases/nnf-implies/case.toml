[case]
tags = ["nnf", "smt2", "changes"]
description = """
NNF must rewrite (=> p q) to (or (not p) q).
Promoted from test_simplify_nnf_script; guards the nnf pass on a minimal script.
"""

[inputs]
smt = "implies-pq.smt2"

[[steps]]
script = "main.py"
args = ["simplify", "{smt}", "nnf", "{work}/out.smt2"]
timeout = 60
capture_json = true

[[assert]]
kind = "exit_ok"

[[assert]]
kind = "pass_stats"
pass = "nnf"
field = "asserts_changed"
min = 1
