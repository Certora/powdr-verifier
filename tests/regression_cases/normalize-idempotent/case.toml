[case]
tags = ["normalize", "smt2", "no-change"]
description = """
Normalize on a script with no asserts should not change anything.
"""

[inputs]
smt = "normalize.smt2"

[[steps]]
script = "main.py"
args = ["simplify", "{smt}", "normalize", "{work}/out.smt2"]
timeout = 60
capture_json = true

[[assert]]
kind = "exit_ok"

[[assert]]
kind = "pass_unchanged"
pass = "normalize"
